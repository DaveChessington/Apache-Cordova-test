<style>
  body {
  background: linear-gradient(135deg, #6366f1, #4f46e5);
  font-family: Arial, sans-serif;
  padding: 40px;
}

.container {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 20px;
}

.card {
  background: white;
  padding: 25px;
  border-radius: 12px;
  width: 30%;
  box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.card:hover {
  transform: translateY(-5px);
  box-shadow: 0 15px 25px rgba(0, 0, 0, 0.25);
}

.card h3 {
  margin-top: 0;
  color: #4f46e5;
}

.card p {
  color: #444;
}

</style>
<div class="container">
  <div class="card">
    <h3>Item 1</h3>
    <p>Descripción breve del elemento uno.</p>
  </div>

  <div class="card">
    <h3>Item 2</h3>
    <p>Descripción breve del elemento dos.</p>
  </div>

  <div class="card">
    <h3>Item 3</h3>
    <p>Descripción breve del elemento tres.</p>
  </div>
</div>
