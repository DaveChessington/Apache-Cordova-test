<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Sign Up</title>
    <script src="js/components/base.js"></script>
  </head>
  <body class="bg-light d-flex align-items-center min-vh-100">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-sm-8 col-md-6 col-lg-4">
          <div class="card shadow-sm border-0 px-4 py-5 bg-white rounded-4">
            <div class="text-center mb-4">
              <h2 class="fw-bold text-primary">Create Account</h2>
              <p class="text-muted">Sign up to get started</p>
            </div>

            <form id="signupForm">
              <div class="form-floating mb-3">
                <input
                  type="text"
                  id="registerName"
                  class="form-control"
                  placeholder="John Doe"
                  required
                />
                <label for="registerName">Full Name</label>
              </div>

              <div class="form-floating mb-3">
                <input
                  type="email"
                  id="registerEmail"
                  class="form-control"
                  placeholder="name@example.com"
                  required
                />
                <label for="registerEmail">Email address</label>
              </div>

              <div class="form-floating mb-3">
                <input
                  type="password"
                  id="registerPassword"
                  class="form-control"
                  placeholder="Password"
                  required
                />
                <label for="registerPassword">Password</label>
              </div>

              <div class="form-floating mb-4">
                <input
                  type="password"
                  id="registerRepeatPassword"
                  class="form-control"
                  placeholder="Repeat Password"
                  required
                />
                <label for="registerRepeatPassword">Confirm Password</label>
              </div>

              <button
                type="submit"
                class="btn btn-primary w-100 py-2.5 fs-5 rounded-3 shadow-sm"
              >
                Sign Up
              </button>

              <div class="text-center mt-4">
                <p class="small text-muted mb-0">
                  Already have an account?
                  <a href="index.html" class="text-decoration-none fw-semibold"
                    >Log in</a
                  >
                </p>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
