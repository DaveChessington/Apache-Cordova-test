<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Home</title>
  <script src="js/home.js"></script>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="#">
        <img
          src="https://getbootstrap.com/docs/5.3/assets/brand/bootstrap-logo.svg"
          width="30"
          height="24"
          class="d-inline-block align-text-top"
          alt="Logo"
        />
        <span class="fw-semibold">Bootstrap</span>
      </a>
      
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarNav"
        aria-controls="navbarNav"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto"> <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="#">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Features</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Pricing</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container my-5">
    <div class="row justify-content-center text-center">
      <div class="col-lg-8">
        
        <div class="p-5 mb-5 bg-white rounded-4 shadow-sm border">
          <h1 class="display-4 fw-bold text-dark">Welcome Users!</h1>
          <p class="lead text-muted fs-5">This is the home page for users. Glad to have you back!</p>
          <hr class="my-4 mx-auto w-25 text-primary" style="height: 3px;">
        </div>

        <div class="d-flex justify-content-center">
          <div class="card shadow border-0 rounded-4 overflow-hidden" style="width: 20rem;">
            <img id="avatarUsuario" class="card-img-top bg-secondary-subtle" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=800&q=80" alt="User Profile" style="height: 200px; object-fit: cover;" />
            <div class="card-body p-4 text-start">
              <h5 class="text-uppercase text-xs fw-bold text-primary mb-1">Profile</h5>
              <h3 class="card-title h4 fw-bold text-dark mb-3" id="username">John Doe</h3>
              <p id="email" class="card-text text-muted small mb-0">
                Some quick example text to build on the card title and make up the
                bulk of the card's content.
              </p>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
