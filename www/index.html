<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta
      name="viewport"
      content="initial-scale=1, width=device-width, viewport-fit=cover"
    />
    <!--<meta http-equiv="Content-Security-Policy" content="default-src 'self' data: https://ssl.gstatic.com 'unsafe-eval' http://davechessington.pythonanywhere.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; media-src *; img-src 'self' data: content: https://mdbcdn.b-cdn.net;" />-->
    <title>login</title>
    <script src="js/components/base.js"></script>
  </head>
  <body>
    <section class="min-vh-100 d-flex flex-column justify-content-between">
      <div
        class="container-fluid flex-grow-1 d-flex align-items-center justify-content-center py-5"
      >
        <div class="row w-100 d-flex justify-content-center align-items-center">
          <div class="col-md-9 col-lg-6 col-xl-5 mb-4 mb-lg-0">
            <img
              src="https://mdbcdn.b-cdn.net/img/Photos/new-templates/bootstrap-login-form/draw2.webp"
              class="img-fluid"
              alt="Sample image"
            />
          </div>

          <div class="col-md-8 col-lg-6 col-xl-4 offset-xl-1">
            <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
              <form id="loginForm">
                <div
                  class="d-flex flex-row align-items-center justify-content-center justify-content-lg-start mb-4"
                >
                  <h1 class="lead fw-normal mb-0 me-3 fs-3">Sign in</h1>
                </div>

                <div data-mdb-input-init class="form-outline mb-4">
                  <label class="form-label fw-semibold" for="emailInput"
                    >Email address</label
                  >
                  <input
                    type="email"
                    id="emailInput"
                    class="form-control form-control-lg"
                    placeholder="Enter a valid email address"
                  />
                </div>

                <div data-mdb-input-init class="form-outline mb-3">
                  <label class="form-label fw-semibold" for="passwordInput"
                    >Password</label
                  >
                  <input
                    type="password"
                    id="passwordInput"
                    class="form-control form-control-lg"
                    placeholder="Enter password"
                  />
                </div>

                <div class="d-flex justify-content-between align-items-center">
                  <a href="#!" class="text-body">Forgot password?</a>
                </div>

                <div class="text-center text-lg-start mt-4 pt-2">
                  <button
                    type="submit"
                    data-mdb-button-init
                    data-mdb-ripple-init
                    class="btn btn-primary btn-lg w-100"
                  >
                    Login
                  </button>
                  <p class="small fw-bold mt-3 mb-0 text-center text-lg-start">
                    Don't have an account?
                    <a href="signup.html" class="link-danger">Register</a>
                  </p>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>

      <div
        class="d-flex flex-column flex-md-row text-center text-md-start justify-content-between py-4 px-4 px-xl-5 bg-primary mt-auto"
      >
        <div class="text-white mb-3 mb-md-0">
          Copyright © 2026. All rights reserved.
        </div>
      </div>
    </section>
  </body>
</html>
