<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <title>Add User</title>
  <script src="../../js/components/base.js"></script>
</head>

<body>
  <style>
    body {
      background-color: #f4f7f6;
    }

    .card {
      border: none;
      border-radius: 12px;
    }

    .avatar-container {
      position: relative;
      display: inline-block;
    }

    .avatar-badge {
      position: absolute;
      bottom: 5px;
      right: 5px;
      background-color: #0d6efd;
      color: white;
      border-radius: 50%;
      padding: 6px 8px;
      font-size: 0.75rem;
      border: 3px solid #fff;
    }

    .form-control:focus,
    .form-check-input:focus {
      box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.15);
    }
  </style>

  <div class="container my-5">
    <div class="row g-4">
      <div class="col-xl-4 col-lg-4 col-md-12">
        <div class="card shadow-sm h-100 text-center p-4">
          <div class="card-body d-flex flex-column align-items-center">
            <div class="avatar-container mb-3">
              <img id="profile-picture" src="../../img/placeholder.png" alt="profile picture"
                class="rounded-circle img-thumbnail shadow-sm" style="width: 360px; height: 360px; object-fit: cover" />
              <span class="avatar-badge" title="Usuario Verificado"><i class="bi bi-shield-check"></i></span>
              <div class="mb-4">
                <label for="avatarInput" class="btn btn-outline-primary btn-sm w-100 rounded-3">
                  <i class="bi bi-camera me-2"></i>Choose Avatar
                </label>
                <input type="file" id="avatarInput" accept="image/*" class="d-none" />
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="col-xl-8 col-lg-8 col-md-12">
        <div class="card shadow-sm h-100 p-4">
          <div class="card-body">
            <form>
              <h5 class="card-title fw-bold text-dark mb-4 pb-2 border-bottom">
                Información Personal
              </h5>

              <div class="row g-3 mb-4">
                <div class="col-md-6">
                  <label for="name_text" class="form-label small fw-semibold text-secondary">Nombre Completo</label>
                  <input type="text" class="form-control form-control-lg fs-6" id="name_text"
                    placeholder="Ej. Yuki Hayashi" />
                </div>
                <div class="col-md-6">
                  <label for="email_text" class="form-label small fw-semibold text-secondary">Correo Electrónico</label>
                  <input type="email" class="form-control form-control-lg fs-6" id="email_text"
                    placeholder="nombre@ejemplo.com" />
                </div>
                <div class="col-md-6">
                  <label for="password" class="form-label small fw-semibold text-secondary">Contraseña</label>
                  <input type="password" class="form-control form-control-lg fs-6" id="password"
                    placeholder="••••••••" />
                </div>
                <div class="col-md-6">
                  <label for="confirm" class="form-label small fw-semibold text-secondary">Confirmar Contraseña</label>
                  <input type="password" class="form-control form-control-lg fs-6" id="confirm"
                    placeholder="••••••••" />
                </div>
                <div class="col-md-6">
                  <label for="role_text" class="form-label small fw-semibold text-secondary">Rol</label>
                  <select class="form-control form-control-lg fs-6" id="role_text">
                    <option value="admin">Administrador</option>
                    <option value="user">Usuario</option>
                  </select>
                </div>
              </div>

              <div class="mb-4 bg-light p-3 rounded-3 d-flex align-items-center">
                <div class="form-check form-switch m-0">
                  <input type="checkbox" class="form-check-input style-switch" id="login_approved" role="switch" />
                  <label class="form-check-label fw-medium text-dark ms-2" for="login_approved">Login Aprobado</label>
                </div>
                <i class="bi bi-info-circle text-muted ms-auto" data-bs-toggle="tooltip"
                  title="Permite al usuario iniciar sesión directamente"></i>
              </div>

              <div class="d-flex justify-content-end gap-2 pt-2">
                <a href="user_list.html" id="cancel" class="btn btn-light border px-4 py-2 fw-medium text-secondary">
                  Cancelar
                </a>
                <button type="submit" id="submit" class="btn btn-primary px-4 py-2 fw-medium shadow-sm">
                  Crear Usuario
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
