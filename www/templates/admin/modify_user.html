<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Modify User</title>
    <script src="js/components/base.js"></script>
    <link href="https://jsdelivr.net" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
<link href="https://jsdelivr.net" rel="stylesheet">

  </head>
  <body>
    <style>
      body {
        background-color: #f4f7f6;
      }
      .card {
        border: none;
        border-radius: 12px;
      }
      .avatar-container {
        position: relative;
        display: inline-block;
      }
      .avatar-badge {
        position: absolute;
        bottom: 5px;
        right: 5px;
        background-color: #0d6efd;
        color: white;
        border-radius: 50%;
        padding: 6px 8px;
        font-size: 0.75rem;
        border: 3px solid #fff;
      }
      .form-control:focus,
      .form-check-input:focus {
        box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.15);
      }
    </style>

    <div class="container my-5">
      <div class="row g-4">
        <!-- Columna Izquierda: Perfil -->
        <div class="col-xl-4 col-lg-4 col-md-12">
          <div class="card shadow-sm h-100 text-center p-4">
            <div class="card-body d-flex flex-column justify-content-between">
              <div>
                <div class="avatar-container mb-3">
                  <img
                    src="https://bootdey.com"
                    alt="Yuki Hayashi"
                    class="rounded-circle img-thumbnail shadow-sm"
                    style="width: 120px; height: 120px; object-fit: cover"
                  />
                  <span class="avatar-badge" title="Usuario Verificado"
                    ><i class="bi bi-shield-check"></i
                  ></span>
                </div>
                <h5 class="fw-bold mb-1">Yuki Hayashi</h5>
                <p class="text-muted small mb-4">yuki@Maxwell.com</p>
              </div>

              <div class="border-top pt-4 text-start">
                <div
                  class="d-flex justify-content-between align-items-center mb-3"
                >
                  <span class="text-secondary small fw-medium">Rol</span>
                  <span
                    class="badge bg-primary-subtle text-primary px-3 py-2 rounded-pill fw-semibold"
                    >Administrador</span
                  >
                </div>
                <div
                  class="d-flex justify-content-between align-items-center mb-2"
                >
                  <span class="text-secondary small fw-medium">Creado</span>
                  <span class="text-dark small fw-semibold">01 Ene, 2023</span>
                </div>
                <div class="d-flex justify-content-between align-items-center">
                  <span class="text-secondary small fw-medium"
                    >Actualizado</span
                  >
                  <span class="text-dark small">02 Ene, 2023</span>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="col-xl-8 col-lg-8 col-md-12">
          <div class="card shadow-sm h-100 p-4">
            <div class="card-body">
              <form>
                <h5
                  class="card-title fw-bold text-dark mb-4 pb-2 border-bottom"
                >
                  Información Personal
                </h5>

                <div class="row g-3 mb-4">
                  <div class="col-md-6">
                    <label
                      for="name"
                      class="form-label small fw-semibold text-secondary"
                      >Nombre Completo</label
                    >
                    <input
                      type="text"
                      class="form-control form-control-lg fs-6"
                      id="name"
                      placeholder="Ej. Yuki Hayashi"
                    />
                  </div>
                  <div class="col-md-6">
                    <label
                      for="eMail"
                      class="form-label small fw-semibold text-secondary"
                      >Correo Electrónico</label
                    >
                    <input
                      type="email"
                      class="form-control form-control-lg fs-6"
                      id="eMail"
                      placeholder="nombre@ejemplo.com"
                    />
                  </div>
                  <div class="col-md-6">
                    <label
                      for="password"
                      class="form-label small fw-semibold text-secondary"
                      >Contraseña</label
                    >
                    <input
                      type="password"
                      class="form-control form-control-lg fs-6"
                      id="password"
                      placeholder="••••••••"
                    />
                  </div>
                  <div class="col-md-6">
                    <label
                      for="confirm"
                      class="form-label small fw-semibold text-secondary"
                      >Confirmar Contraseña</label
                    >
                    <input
                      type="password"
                      class="form-control form-control-lg fs-6"
                      id="confirm"
                      placeholder="••••••••"
                    />
                  </div>
                </div>

                <div
                  class="mb-4 bg-light p-3 rounded-3 d-flex align-items-center"
                >
                  <div class="form-check form-switch m-0">
                    <input
                      type="checkbox"
                      class="form-check-input style-switch"
                      id="exampleCheck1"
                      role="switch"
                    />
                    <label
                      class="form-check-label fw-medium text-dark ms-2"
                      for="exampleCheck1"
                      >Login Aprobado</label
                    >
                  </div>
                  <i
                    class="bi bi-info-circle text-muted ms-auto"
                    data-bs-toggle="tooltip"
                    title="Permite al usuario iniciar sesión directamente"
                  ></i>
                </div>

                <div class="d-flex justify-content-end gap-2 pt-2">
                  <button
                    type="button"
                    id="cancel"
                    class="btn btn-light border px-4 py-2 fw-medium text-secondary"
                  >
                    Cancelar
                  </button>
                  <button
                    type="submit"
                    id="submit"
                    class="btn btn-primary px-4 py-2 fw-medium shadow-sm"
                  >
                    Actualizar Perfil
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
